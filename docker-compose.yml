services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: visibilityos
      POSTGRES_PASSWORD: visibilityos
      POSTGRES_DB: visibilityos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visibilityos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "alembic upgrade head &&
             python /app/scripts/seed.py &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --app-dir src --reload"
    environment:
      DATABASE_URL: postgresql+psycopg2://visibilityos:visibilityos@db:5432/visibilityos
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: visibilityos-dev-secret-change-me-min-32-chars
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      SCAN_COMMITMENT_MODE: rotating_weekly
      APP_ENV: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A workers.celery_app.celery_app worker -Q scan,parse,rollup,export -l info
    environment:
      DATABASE_URL: postgresql+psycopg2://visibilityos:visibilityos@db:5432/visibilityos
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: visibilityos-dev-secret-change-me-min-32-chars
      SCAN_COMMITMENT_MODE: rotating_weekly
      PYTHONPATH: /app/src
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A workers.celery_app.celery_app beat -l info
    environment:
      DATABASE_URL: postgresql+psycopg2://visibilityos:visibilityos@db:5432/visibilityos
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: visibilityos-dev-secret-change-me-min-32-chars
      SCAN_COMMITMENT_MODE: rotating_weekly
      PYTHONPATH: /app/src
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE: /api/v1
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  frontend_node_modules:
